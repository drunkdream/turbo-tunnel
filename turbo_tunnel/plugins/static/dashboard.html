<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turbo Tunnel Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%);
            color: #F8FAFC;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated background particles */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: rgba(0, 217, 255, 0.1);
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-100px) translateX(50px); }
        }

        .container-fluid {
            position: relative;
            z-index: 1;
            padding: 20px;
        }

        /* Top Navigation */
        .top-nav {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px 30px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .top-nav h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #00D9FF 0%, #0EA5E9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        /* Toggle Switch */
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toggle-label {
            font-size: 13px;
            color: #CBD5E1;
            font-weight: 500;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: 0.4s;
            border-radius: 34px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 3px;
            background-color: #CBD5E1;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background: linear-gradient(135deg, #00D9FF, #0EA5E9);
            border-color: transparent;
        }

        input:checked + .toggle-slider:before {
            transform: translateX(24px);
            background-color: white;
        }

        .toggle-slider:hover {
            border-color: rgba(0, 217, 255, 0.5);
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #10B981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
        }

        .status-dot.disconnected {
            background: #EF4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }

        /* Statistics Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #00D9FF, #0EA5E9, #0284C7);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 217, 255, 0.2);
            border-color: rgba(0, 217, 255, 0.3);
        }

        .stat-card:hover::before {
            transform: scaleX(1);
        }

        .stat-card-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-info h3 {
            font-size: 14px;
            font-weight: 600;
            color: #CBD5E1;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #F8FAFC;
            transition: all 0.3s ease;
        }

        .stat-value.highlight {
            color: #00D9FF;
            animation: valueUpdate 0.5s ease;
        }

        @keyframes valueUpdate {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .stat-icon {
            font-size: 40px;
            opacity: 0.3;
        }

        /* Chart Container */
        .chart-container {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .chart-header {
            margin-bottom: 20px;
        }

        .chart-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: #F8FAFC;
        }

        #trafficChart {
            max-height: 300px;
        }

        /* Connections Table */
        .table-container {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .table-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: #F8FAFC;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #CBD5E1;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            background: rgba(0, 217, 255, 0.1);
            border-color: #00D9FF;
            color: #00D9FF;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #00D9FF, #0EA5E9);
            border-color: transparent;
            color: #0F172A;
        }

        .table-wrapper {
            overflow-x: auto;
            overflow-y: auto;
            /* Fixed height for 10 rows: thead (50px) + 10 rows * 50px = 550px */
            height: 550px;
            max-height: 550px;
        }

        /* Custom scrollbar styling to match page theme */
        .table-wrapper::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }

        .table-wrapper::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #0EA5E9 0%, #00D9FF 100%);
            border-radius: 6px;
            border: 2px solid rgba(15, 23, 42, 0.5);
        }

        .table-wrapper::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #00D9FF 0%, #0EA5E9 100%);
            box-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
        }

        .table-wrapper::-webkit-scrollbar-thumb:active {
            background: #00D9FF;
        }

        /* Firefox scrollbar styling */
        .table-wrapper {
            scrollbar-width: thin;
            scrollbar-color: #0EA5E9 rgba(15, 23, 42, 0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(15, 23, 42, 0.95);
        }

        th {
            padding: 15px 12px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            color: #94A3B8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        td {
            padding: 15px 12px;
            font-size: 14px;
            color: #CBD5E1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        tbody tr {
            transition: all 0.3s ease;
        }

        tbody tr:hover {
            background: rgba(0, 217, 255, 0.05);
        }

        tbody tr.active {
            background: rgba(16, 185, 129, 0.05);
        }

        tbody tr.closed {
            opacity: 0.6;
        }

        .status-badge {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-badge.active {
            background: #10B981;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
        }

        .status-badge.closed {
            background: #EF4444;
        }

        .mono {
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        .text-primary {
            color: #00D9FF !important;
        }

        .text-success {
            color: #10B981 !important;
        }

        .text-warning {
            color: #F59E0B !important;
        }

        /* Loading Spinner */
        .loading {
            text-align: center;
            padding: 40px;
            color: #94A3B8;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #00D9FF;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .top-nav {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .table-wrapper {
                overflow-x: scroll;
            }
        }
    </style>
</head>
<body>
    <!-- Background Particles -->
    <div class="bg-particles" id="particles"></div>

    <div class="container-fluid">
        <!-- Top Navigation -->
        <div class="top-nav">
            <h1>🚀 Turbo Tunnel Dashboard</h1>
            <div class="status-indicator">
                <div class="toggle-container">
                    <span class="toggle-label">Background Animation</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="bgToggle" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <span class="status-dot connected" id="statusDot"></span>
                <span id="statusText">Connected</span>
            </div>
        </div>

        <!-- Statistics Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-card-content">
                    <div class="stat-info">
                        <h3>Total Connections</h3>
                        <div class="stat-value" id="totalConnections">0</div>
                    </div>
                    <div class="stat-icon">📊</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-card-content">
                    <div class="stat-info">
                        <h3>Active Connections</h3>
                        <div class="stat-value text-success" id="activeConnections">0</div>
                    </div>
                    <div class="stat-icon">✅</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-card-content">
                    <div class="stat-info">
                        <h3>Total Sent</h3>
                        <div class="stat-value text-primary" id="totalSent">0 B</div>
                    </div>
                    <div class="stat-icon">📤</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-card-content">
                    <div class="stat-info">
                        <h3>Total Received</h3>
                        <div class="stat-value text-warning" id="totalReceived">0 B</div>
                    </div>
                    <div class="stat-icon">📥</div>
                </div>
            </div>
        </div>

        <!-- Traffic Chart -->
        <div class="chart-container">
            <div class="chart-header">
                <h2>📈 Traffic Trends (Last 60s)</h2>
            </div>
            <canvas id="trafficChart"></canvas>
        </div>

        <!-- Connections Table -->
        <div class="table-container">
            <div class="table-header">
                <h2>🔗 Connection List</h2>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="closed">Closed</button>
                </div>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Status</th>
                            <th>Source</th>
                            <th>Target</th>
                            <th>Tunnel</th>
                            <th>Start Time</th>
                            <th>Duration</th>
                            <th>Sent</th>
                            <th>Received</th>
                            <th>Rate (↑/↓)</th>
                        </tr>
                    </thead>
                    <tbody id="connectionsTable">
                        <tr>
                            <td colspan="9" class="loading">
                                <div class="spinner"></div>
                                <div>Connecting to server...</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        // WebSocket connection
        let ws = null;
        let reconnectInterval = null;
        let currentFilter = 'all';
        let chart = null;

        // Chart data
        const chartData = {
            labels: [],
            sendRates: [],
            recvRates: []
        };
        const maxDataPoints = 60;

        // Create background particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = Math.random() * 100 + 50 + 'px';
                particle.style.height = particle.style.width;
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
                container.appendChild(particle);
            }
        }

        // Toggle background animation
        function toggleBackgroundAnimation(enabled) {
            const particlesContainer = document.getElementById('particles');
            if (enabled) {
                particlesContainer.style.display = 'block';
            } else {
                particlesContainer.style.display = 'none';
            }
            // Save preference
            localStorage.setItem('bgAnimationEnabled', enabled ? 'true' : 'false');
        }

        // Load background animation preference
        function loadBackgroundPreference() {
            const savedPreference = localStorage.getItem('bgAnimationEnabled');
            const isEnabled = savedPreference === null ? true : savedPreference === 'true';
            
            const toggle = document.getElementById('bgToggle');
            toggle.checked = isEnabled;
            toggleBackgroundAnimation(isEnabled);
        }

        // Initialize Chart
        function initChart() {
            const ctx = document.getElementById('trafficChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartData.labels,
                    datasets: [
                        {
                            label: 'Send Rate',
                            data: chartData.sendRates,
                            borderColor: '#00D9FF',
                            backgroundColor: 'rgba(0, 217, 255, 0.1)',
                            fill: true,
                            tension: 0.4,
                            pointRadius: 0,
                            borderWidth: 2
                        },
                        {
                            label: 'Receive Rate',
                            data: chartData.recvRates,
                            borderColor: '#10B981',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            fill: true,
                            tension: 0.4,
                            pointRadius: 0,
                            borderWidth: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                color: '#CBD5E1',
                                font: {
                                    family: 'Inter',
                                    size: 12
                                },
                                usePointStyle: true,
                                padding: 15
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleColor: '#F8FAFC',
                            bodyColor: '#CBD5E1',
                            borderColor: 'rgba(0, 217, 255, 0.3)',
                            borderWidth: 1,
                            padding: 12,
                            displayColors: true,
                            callbacks: {
                                label: function(context) {
                                    const value = context.parsed.y;
                                    const formattedValue = formatBytes(value);
                                    return context.dataset.label + ': ' + formattedValue + '/s';
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            display: true,
                            grid: {
                                color: 'rgba(255, 255, 255, 0.05)',
                                drawBorder: false
                            },
                            ticks: {
                                color: '#94A3B8',
                                font: {
                                    family: 'Inter',
                                    size: 11
                                },
                                maxTicksLimit: 10
                            }
                        },
                        y: {
                            display: true,
                            grid: {
                                color: 'rgba(255, 255, 255, 0.05)',
                                drawBorder: false
                            },
                            ticks: {
                                color: '#94A3B8',
                                font: {
                                    family: 'Inter',
                                    size: 11
                                },
                                callback: function(value) {
                                    // Ensure value is valid before formatting
                                    if (value === undefined || value === null) {
                                        return '0 B/s';
                                    }
                                    const formatted = formatBytes(value);
                                    return formatted + '/s';
                                }
                            },
                            beginAtZero: true
                        }
                    },
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    }
                }
            });
        }

        // Format bytes to human readable
        function formatBytes(bytes) {
            // Handle undefined, null first
            if (bytes === undefined || bytes === null) {
                return '0 B';
            }
            
            // Try to convert to number
            const numBytes = Number(bytes);
            
            // Check if conversion resulted in NaN or invalid number
            if (isNaN(numBytes) || !isFinite(numBytes)) {
                return '0 B';
            }
            
            // Handle zero or negative values
            if (numBytes <= 0) {
                return '0 B';
            }
            
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(numBytes) / Math.log(k));
            
            // Ensure index is within bounds
            const sizeIndex = Math.min(i, sizes.length - 1);
            const sizeIndex2 = Math.max(sizeIndex, 0);
            
            return parseFloat((numBytes / Math.pow(k, sizeIndex2)).toFixed(2)) + ' ' + sizes[sizeIndex2];
        }

        // Connect to WebSocket
        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('WebSocket connected');
                updateStatus(true);
                if (reconnectInterval) {
                    clearInterval(reconnectInterval);
                    reconnectInterval = null;
                }
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    updateDashboard(data);
                } catch (e) {
                    console.error('Failed to parse message:', e);
                }
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
                updateStatus(false);
                if (!reconnectInterval) {
                    reconnectInterval = setInterval(() => {
                        console.log('Attempting to reconnect...');
                        connect();
                    }, 3000);
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }

        // Update connection status
        function updateStatus(connected) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            
            if (connected) {
                statusDot.className = 'status-dot connected';
                statusText.textContent = 'Connected';
            } else {
                statusDot.className = 'status-dot disconnected';
                statusText.textContent = 'Disconnected';
            }
        }

        // Update dashboard with new data
        function updateDashboard(data) {
            // Update statistics
            updateStatistics(data.statistics);

            // Update chart
            updateChart(data.connections);

            // Update table
            updateTable(data.connections);
        }

        // Update statistics cards
        function updateStatistics(stats) {
            const elements = {
                totalConnections: document.getElementById('totalConnections'),
                activeConnections: document.getElementById('activeConnections'),
                totalSent: document.getElementById('totalSent'),
                totalReceived: document.getElementById('totalReceived')
            };

            // Update values directly without animation
            elements.totalConnections.textContent = stats.total_connections;
            elements.activeConnections.textContent = stats.active_connections;
            elements.totalSent.textContent = formatBytes(stats.total_bytes_sent);
            elements.totalReceived.textContent = formatBytes(stats.total_bytes_recv);
        }

        // Update chart data
        function updateChart(connections) {
            const now = new Date();
            const timeLabel = now.toLocaleTimeString();

            // Calculate total rates with safety checks
            let totalSendRate = 0;
            let totalRecvRate = 0;
            
            connections.forEach(conn => {
                if (conn.is_active) {
                    // Safely add rates, default to 0 if invalid
                    const sendRate = (typeof conn.send_rate === 'number' && isFinite(conn.send_rate)) ? conn.send_rate : 0;
                    const recvRate = (typeof conn.recv_rate === 'number' && isFinite(conn.recv_rate)) ? conn.recv_rate : 0;
                    totalSendRate += sendRate;
                    totalRecvRate += recvRate;
                }
            });

            // Add new data point
            chartData.labels.push(timeLabel);
            chartData.sendRates.push(totalSendRate);
            chartData.recvRates.push(totalRecvRate);

            // Keep only last N data points
            if (chartData.labels.length > maxDataPoints) {
                chartData.labels.shift();
                chartData.sendRates.shift();
                chartData.recvRates.shift();
            }

            // Update chart
            if (chart) {
                chart.update('none');
            }
        }

        // Update connections table
        function updateTable(connections) {
            const tbody = document.getElementById('connectionsTable');
            
            // Filter connections
            let filteredConnections = connections;
            if (currentFilter === 'active') {
                filteredConnections = connections.filter(c => c.is_active);
            } else if (currentFilter === 'closed') {
                filteredConnections = connections.filter(c => !c.is_active);
            }

            // Clear table
            tbody.innerHTML = '';

            // Populate table
            if (filteredConnections.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="loading">No connections found</td></tr>';
                return;
            }

            filteredConnections.forEach(conn => {
                const row = document.createElement('tr');
                row.className = conn.is_active ? 'active' : 'closed';
                
                // Safely get rate values, default to 0 if invalid
                const sendRate = (typeof conn.send_rate === 'number' && isFinite(conn.send_rate)) ? conn.send_rate : 0;
                const recvRate = (typeof conn.recv_rate === 'number' && isFinite(conn.recv_rate)) ? conn.recv_rate : 0;
                
                row.innerHTML = `
                    <td>
                        <span class="status-badge ${conn.is_active ? 'active' : 'closed'}"></span>
                    </td>
                    <td class="mono">${conn.source}</td>
                    <td class="mono">${conn.target}</td>
                    <td class="mono">${conn.tunnel}</td>
                    <td>${conn.start_time}</td>
                    <td class="mono">${conn.duration}</td>
                    <td class="text-primary">${formatBytes(conn.bytes_sent)}</td>
                    <td class="text-success">${formatBytes(conn.bytes_recv)}</td>
                    <td class="mono">
                        <span class="text-primary">${formatBytes(sendRate)}/s</span> / 
                        <span class="text-success">${formatBytes(recvRate)}/s</span>
                    </td>
                `;
                
                tbody.appendChild(row);
            });
        }

        // Filter button handlers
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
            });
        });

        // Background animation toggle handler
        document.getElementById('bgToggle').addEventListener('change', (e) => {
            toggleBackgroundAnimation(e.target.checked);
        });

        // Initialize
        createParticles();
        loadBackgroundPreference();
        initChart();
        connect();
    </script>
</body>
</html>
