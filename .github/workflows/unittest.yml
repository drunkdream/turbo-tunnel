name: Unittest

on:
  push:
    branches:
      - master
      - release/*

  pull_request:
    branches:
      - master

jobs:
  test:
    name: Test on python ${{ matrix.python-version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.7', '3.8', '3.9', '3.10', '3.11', '3.12']
        os: [ubuntu-22.04, windows-2019, macos-13]
        exclude:
          - os: macos-13
            python-version: '3.7'
          - os: windows-2019
            python-version: "3.7"

    steps:
      - uses: actions/checkout@v2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v1
        if: matrix.python-version != '3.7'
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python 3.7 via PPA
        if: matrix.os == 'ubuntu-22.04' && matrix.python-version == '3.7'
        run: |
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt update
          sudo apt install python3.7 python3.7-distutils -y
          # Optional: Set as the default python command
          sudo update-alternatives --install /usr/bin/python python /usr/bin/python3.7 1
      - name: Install Dependencies
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo python -m pip install --upgrade pip pytest pytest-cov pytest-tornasync codecov
            sudo python -m pip install -r requirements.txt
          else
            python -m pip install --upgrade pip pytest pytest-cov pytest-tornasync codecov
            python -m pip install -r requirements.txt
          fi
        shell: bash
      - name: Run Tests
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo python -m pytest --cov=.
          else
            python -m pytest --cov=.
          fi
        shell: bash
      - name: Upload coverage reports to Codecov
        run: |
          codecov -t ${{ secrets.CODECOV_TOKEN }}
